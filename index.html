<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aitor Quilez | Portafolio</title>
    <meta name="description"
        content="Portafolio de Aitor Quilez - Desarrollador web especializado en JavaScript y Three.js">
    <link rel="icon" type="image/png" href="Resources/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --dark-grey: #1a1a1a;
            --light-grey: #f0f0f0;
            --mid-grey: #888;
            --dark-grey-border: #444;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Space Mono', monospace;
            color: var(--light-grey);
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: var(--dark-grey);
        }

        #loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 50px;
            height: 50px;
            border: 5px solid var(--mid-grey);
            border-top: 5px solid var(--light-grey);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .ui-element {
            position: fixed;
            z-index: 1;
            padding: 2vw;
        }

        .top-left-name {
            top: 2%;
            left: 5%;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 700;
            opacity: 0.6;
        }

        .dropdown {
            position: fixed;
            z-index: 100;
            padding: 3vw;
        }

        .star-trigger {
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--mid-grey);
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
            user-select: none;
        }

        .star-trigger:hover,
        .star-trigger.active {
            color: var(--light-grey);
            transform: scale(1.2) rotate(15deg);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% { transform: scale(1.3) rotate(15deg); }
            to { transform: scale(1.2) rotate(15deg); }
        }

        /* Modal overlay para móviles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 26, 26, 0.98);
            border: 1px solid var(--dark-grey-border);
            border-radius: 8px;
            padding: 2rem;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--mid-grey);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .modal-close:hover {
            color: var(--light-grey);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Contenido desktop */
        .content-display {
            position: absolute;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s ease-out;
            padding: 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            width: min(90vw, 600px);
            margin: 0 auto;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .dropdown.active .content-display {
            max-height: 500px;
            padding: 1.5vw 1vw;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Layout proyectos desktop */
        #proyectos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vw;
            justify-content: center;
        }

        .subsection {
            display: flex;
            flex-direction: column;
        }

        .subsection h3 {
            font-size: clamp(0.9rem, 2vw, 1rem);
            margin-bottom: 0.5vw;
        }

        /* Posicionamiento iconos */
        #proyectos-dropdown {
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #proyectos-dropdown .content-display {
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        #info-dropdown {
            top: 40%;
            left: 10%;
        }

        #info-dropdown .content-display {
            top: 100%;
            left: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #info-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            opacity: 0.6;
        }

        #contacto-dropdown {
            top: 30%;
            right: 10%;
        }

        #contacto-dropdown .content-display {
            top: 100%;
            right: 0;
            text-align: right;
        }

        .project-link {
            display: block;
            color: var(--mid-grey);
            text-decoration: none;
            margin-bottom: 0.75vw;
            padding: 0.75vw;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .project-link:hover,
        .project-link.active {
            color: var(--light-grey);
            border-color: var(--dark-grey-border);
            background: rgba(255, 255, 255, 0.1);
        }

        .footer {
            bottom: 0.5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.6rem, 1.2vw, 0.7rem);
            color: var(--mid-grey);
            text-align: center;
        }

        /* Tooltip proyectos */
        #project-tooltip {
            display: none;
            position: fixed;
            z-index: 1001;
            background: #2a2a2a;
            border: 1px solid var(--mid-grey);
            border-radius: 8px;
            padding: 1rem;
            width: min(80vw, 300px);
            max-height: 70vh;
            overflow-y: auto;
            opacity: 0;
            transition: all 0.3s ease;
            text-align: left;
            box-sizing: border-box;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
        }

        #project-tooltip.visible {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #project-tooltip img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .tooltip-buttons {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tooltip-button {
            color: var(--light-grey);
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .tooltip-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tooltip-button.hidden {
            display: none;
        }

        /* Contactos */
        .contact-links {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .contact-icon {
            color: var(--mid-grey);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-icon:hover {
            color: var(--light-grey);
            transform: scale(1.2);
        }

        .cv-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: var(--light-grey);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            white-space: nowrap;
            z-index: 2;
        }

        .contact-icon:hover .cv-tooltip {
            display: block;
        }

        /* MOBILE SPECIFIC */
        @media (max-width: 768px) {
            .top-left-name {
                top: 1%;
                left: 3%;
                font-size: clamp(1rem, 4vw, 1.3rem);
            }

            #info-dropdown { top: 20%; left: 5%; }
            #proyectos-dropdown { top: 50%; left: 50%; transform: translate(-50%, -50%); }
            #contacto-dropdown { top: 20%; right: 5%; }

            .star-trigger {
                font-size: clamp(2rem, 8vw, 2.5rem) !important;
            }

            /* Ocultar content-display en móviles, usar modal */
            .content-display {
                display: none !important;
            }

            .modal-content h3 {
                font-size: 1.1rem;
                margin-bottom: 1rem;
                color: var(--light-grey);
                border-bottom: 1px solid var(--dark-grey-border);
                padding-bottom: 0.5rem;
            }

            .modal-content #proyectos {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .modal-content .project-link {
                padding: 1rem;
                font-size: 1rem;
                margin-bottom: 0;
            }

            .modal-content #info {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 1rem;
            }

            .modal-content #info-img {
                width: 80px;
                height: 80px;
            }

            .modal-content #info p {
                font-size: 0.95rem;
                line-height: 1.5;
                text-align: left;
            }

            .modal-content .contact-links {
                justify-content: center;
                gap: 2rem;
            }

            .modal-content .contact-icon i {
                font-size: 1.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="loading-spinner"></div>
    <canvas id="bg-canvas"></canvas>
    <header class="ui-element top-left-name">Aitor Quilez Herrero</header>
    
    <!-- Modal Overlay para móviles -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" aria-label="Cerrar modal">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="dropdown" id="proyectos-dropdown" role="region" data-content="proyectos-content">
        <i class="bi bi-code-slash star-trigger" tabindex="0" aria-expanded="false" aria-controls="proyectos-content"></i>
        <div class="content-display" id="proyectos-content">
            <!-- Contenido desktop -->
            <section id="proyectos-desktop">
                <div class="subsection">
                    <h3>Projects Studies</h3>
                    <!-- proyectos aquí -->
                </div>
                <div class="subsection">
                    <h3>Own Projects</h3>
                    <!-- proyectos aquí -->
                </div>
            </section>
        </div>
    </div>

    <div class="dropdown" id="info-dropdown" role="region" data-content="info-content">
        <i class="bi bi-person star-trigger" tabindex="0" aria-expanded="false" aria-controls="info-content"></i>
        <div class="content-display" id="info-content">
            <section id="info-desktop">
                <img id="info-img" src="Resources/Aitor.jpg" alt="Foto de Aitor Quilez">
                <p>Technology enthusiast transitioning from the chemical industry to software development...</p>
            </section>
        </div>
    </div>

    <div class="dropdown" id="contacto-dropdown" role="region" data-content="contacto-content">
        <i class="bi bi-envelope star-trigger" tabindex="0" aria-expanded="false" aria-controls="contacto-content"></i>
        <div class="content-display" id="contacto-content">
            <section id="contacto-desktop">
                <p>Open to opportunities</p>
                <div class="contact-links">
                    <!-- links de contacto -->
                </div>
            </section>
        </div>
    </div>

    <!-- Tooltip proyectos -->
    <div id="project-tooltip" role="tooltip" aria-hidden="true">
        <img id="tooltip-img" src="" alt="Vista previa" loading="lazy" onerror="this.src='https://via.placeholder.com/300x150?text=No+disponible';">
        <p id="tooltip-desc"></p>
        <div class="tooltip-buttons">
            <a id="tooltip-demo" class="tooltip-button hidden" href="#" target="_blank">Ver Demo</a>
            <a id="tooltip-repo" class="tooltip-button" href="#" target="_blank">Ver Código</a>
        </div>
    </div>

    <footer class="ui-element footer">&copy; 2025 // Thorqui</footer>

    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script type="importmap">
        {"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js"}}
    </script>
    <script type="module">
        // Contenido de secciones (mismo que antes)
        const contentSections = {
            'proyectos-content': `
                <section id="proyectos">
                    <div class="subsection">
                        <h3>Projects Studies</h3>
                        <a href="#" class="project-link" data-img="./Resources/Arete.png" data-description="Web moderna para academia de baile" data-demo="https://thorqui.github.io/AreteDance/" data-repo="https://github.com/thorqui/AreteDance">Arete Dance</a>
                        <a href="#" class="project-link" data-img="./Resources/Street_Figther.png" data-description="Recreación Street Fighter" data-demo="https://thorqui.github.io/QHA_LLMM_2Trim/" data-repo="https://github.com/thorqui/QHA_LLMM_2Trim">Street Fighter</a>
                        <!-- más proyectos... -->
                    </div>
                    <div class="subsection">
                        <h3>Own Projects</h3>
                        <a href="#" class="project-link" data-img="./Resources/Puzzle.png" data-description="Rompecabezas matemático" data-demo="https://thorqui.github.io/Brain_Puzzle/" data-repo="https://github.com/Thorqui/Brain_Puzzle">Brain Puzzle</a>
                        <!-- más proyectos... -->
                    </div>
                </section>
            `,
            'info-content': `
                <section id="info">
                    <img id="info-img" src="Resources/Aitor.jpg" alt="Foto de Aitor Quilez">
                    <p>Technology enthusiast transitioning from the chemical industry to software development, combining 15+ years of professional experience with newly acquired technical skills. <strong>Currently completing official training in Multiplatform Application Development (DAM)</strong> Seeking a challenging role in a dynamic tech environment.</p>
                </section>
            `,
            'contacto-content': `
                <section id="contacto">
                    <p>Open to opportunities</p>
                    <div class="contact-links">
                        <a href="mailto:aitorquilez@gmail.com" class="contact-icon" aria-label="Email"><i class="bi bi-envelope"></i></a>
                        <a href="Resources/CV_QHA.pdf" download class="contact-icon" aria-label="CV"><i class="bi bi-file-earmark-text"></i><span class="cv-tooltip">CV (PDF)</span></a>
                        <a href="https://www.linkedin.com/in/aitor-quilez-817324365/" class="contact-icon" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
                        <a href="https://github.com/Thorqui" class="contact-icon" aria-label="GitHub"><i class="bi bi-github"></i></a>
                    </div>
                </section>
            `
        };

        try {
            // Three.js setup (mismo que antes)
            const { Scene, PerspectiveCamera, WebGLRenderer, BufferGeometry, Float32BufferAttribute, PointsMaterial, Points, Vector3, Vector2, Clock, AdditiveBlending } = await import('three');
            
            // Inicialización canvas y partículas (código igual al anterior)
            const canvas = document.getElementById('bg-canvas');
            const scene = new Scene();
            const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            const renderer = new WebGLRenderer({ canvas, antialias: window.innerWidth > 768 });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Partículas de fondo
            const particleCount = window.innerWidth <= 768 ? 2000 : 4000;
            const positions = new Float32Array(particleCount * 3).map(() => (Math.random() - 0.5) * 15);
            const particlesGeometry = new BufferGeometry();
            particlesGeometry.setAttribute('position', new Float32BufferAttribute(positions, 3));
            const particlesMaterial = new PointsMaterial({ color: 0xcccccc, size: 0.02, transparent: true, opacity: 0.6 });
            const backgroundParticles = new Points(particlesGeometry, particlesMaterial);
            scene.add(backgroundParticles);

            // Elementos DOM
            const starTriggers = document.querySelectorAll('.star-trigger');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalClose = document.querySelector('.modal-close');
            const modalBody = document.getElementById('modal-body');
            const isMobile = window.innerWidth <= 768;

            // Sistema de partículas para iconos
            const iconParticleSystems = new Map();
            starTriggers.forEach(trigger => {
                const particleCount = 10;
                const positions = new Float32Array(particleCount * 3).fill(0);
                const velocities = new Float32Array(particleCount * 3).map(() => (Math.random() - 0.5) * 0.2);
                const lifetimes = new Float32Array(particleCount).fill(0);
                
                const geometry = new BufferGeometry();
                geometry.setAttribute('position', new Float32BufferAttribute(positions, 3));
                geometry.setAttribute('velocity', new Float32BufferAttribute(velocities, 3));
                geometry.setAttribute('lifetime', new Float32BufferAttribute(lifetimes, 1));
                
                const material = new PointsMaterial({ color: 0xcccccc, size: 0.03, transparent: true, opacity: 0.8, blending: AdditiveBlending });
                const particleSystem = new Points(geometry, material);
                particleSystem.visible = false;
                scene.add(particleSystem);
                iconParticleSystems.set(trigger, { system: particleSystem, active: false });
            });

            // Función para cerrar todo
            function closeAll() {
                document.querySelectorAll('.dropdown').forEach(dropdown => {
                    dropdown.classList.remove('active');
                    const trigger = dropdown.querySelector('.star-trigger');
                    if (trigger) {
                        trigger.setAttribute('aria-expanded', 'false');
                        trigger.classList.remove('active');
                        const data = iconParticleSystems.get(trigger);
                        if (data) {
                            data.active = false;
                            data.system.visible = false;
                        }
                    }
                });
                modalOverlay.classList.remove('active');
                document.getElementById('project-tooltip').classList.remove('visible');
            }

            // Toggle dropdown/modal
            function toggleSection(trigger) {
                const dropdown = trigger.closest('.dropdown');
                const contentId = dropdown.dataset.content || trigger.getAttribute('aria-controls');
                const isActive = dropdown.classList.contains('active');
                
                closeAll();
                
                if (!isActive) {
                    // Abrir sección
                    dropdown.classList.add('active');
                    trigger.setAttribute('aria-expanded', 'true');
                    trigger.classList.add('active');
                    
                    const data = iconParticleSystems.get(trigger);
                    if (data) {
                        data.active = true;
                        data.system.visible = true;
                    }
                    
                    if (isMobile) {
                        // Modal móvil
                        modalBody.innerHTML = contentSections[contentId];
                        modalOverlay.classList.add('active');
                        document.querySelectorAll('.project-link').forEach(link => {
                            link.addEventListener('click', handleProjectClick);
                        });
                    } else {
                        // Desktop
                        const content = document.getElementById(contentId);
                        if (content) content.style.display = 'block';
                    }
                }
            }

            // Event listeners
            starTriggers.forEach(trigger => {
                trigger.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleSection(trigger);
                });

                trigger.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggleSection(trigger);
                    }
                });

                // Hover effects (solo desktop)
                if (!isMobile) {
                    trigger.addEventListener('mouseenter', () => {
                        if (!trigger.closest('.dropdown').classList.contains('active')) {
                            const data = iconParticleSystems.get(trigger);
                            if (data) {
                                data.active = data.system.visible = true;
                                trigger.classList.add('active');
                            }
                        }
                    });

                    trigger.addEventListener('mouseleave', () => {
                        if (!trigger.closest('.dropdown').classList.contains('active')) {
                            const data = iconParticleSystems.get(trigger);
                            if (data) {
                                data.active = data.system.visible = false;
                                trigger.classList.remove('active');
                            }
                        }
                    });
                }
            });

            // Cierre modal
            modalClose.addEventListener('click', closeAll);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeAll();
            });

            // Teclado escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeAll();
            });

            // Click fuera de dropdowns (desktop)
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.dropdown') && !e.target.closest('#project-tooltip')) {
                    closeAll();
                }
            });

            // Tooltips proyectos
            function handleProjectClick(e) {
                e.preventDefault();
                e.stopPropagation();
                const tooltip = document.getElementById('project-tooltip');
                const tooltipImg = document.getElementById('tooltip-img');
                const tooltipDesc = document.getElementById('tooltip-desc');
                const tooltipDemo = document.getElementById('tooltip-demo');
                const tooltipRepo = document.getElementById('tooltip-repo');
                
                tooltipImg.src = e.target.dataset.img;
                tooltipDesc.textContent = e.target.dataset.description;
                tooltipDemo.href = e.target.dataset.demo || '#';
                tooltipRepo.href = e.target.dataset.repo || '#';
                tooltipDemo.classList.toggle('hidden', !e.target.dataset.demo);
                tooltip.classList.add('visible');
            }

            // Animación y render (mismo código three.js)
            const mouse = new Vector2();
            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            const clock = new Clock();
            function animate() {
                const elapsedTime = clock.getElapsedTime();
                backgroundParticles.rotation.y = elapsedTime * 0.05;
                camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.02;
                camera.position.y += (mouse.y * 0.5 - camera.position.y) * 0.02;
                camera.lookAt(scene.position);
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(() => {
                document.getElementById('loading-spinner').style.display = 'none';
                animate();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } catch (error) {
            console.error('Error:', error);
            document.getElementById('loading-spinner').style.display = 'none';
        }
    </script>
</body>

</html>
